<h1 mat-dialog-title>Cambio de contraseña </h1>

<mat-dialog-content class="mat-typography">


  <form [formGroup]="formResetPass" class="form">
    <mat-form-field>
      <input matInput placeholder="Contraseña" [type]="hide ? 'password' : 'text'" formControlName="password" required
        cdkFocusInitial>
      <mat-icon matSuffix (click)="hide = !hide">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
      <mat-hint *ngIf="!passwordInput.value">Ingresa tu contraseña</mat-hint>
    </mat-form-field>

    <mat-form-field>
      <input matInput placeholder="Confirmar contraseña" [type]="hide ? 'password' : 'text'"
        formControlName="confirmPassword" required>
      <mat-hint *ngIf="!confirmPasswordInput.value">Confirma tu contraseña</mat-hint>
    </mat-form-field>
  </form>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button mat-stroked-button mat-dialog-close>Cerrar</button>
  <button mat-flat-button color="primary" [disabled]="formResetPass.invalid" (click)="Submit()">Confirmar</button>

</mat-dialog-actions>
