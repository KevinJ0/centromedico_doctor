<section class="content">

  <form [formGroup]="specForm" class="add-form">

    <mat-form-field appearance="outline">
      <mat-label>Especialidades</mat-label>
      <mat-select formControlName="specControl" value="">
        <mat-option *ngFor="let espec of especialidades" [value]="espec.id">
          {{espec.descrip}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <button (click)="addSpec()" mat-fab color="warn" aria-label="add speciality" [disabled]="this.specForm.get('specControl').invalid">
      <mat-icon>add</mat-icon>
    </button>

  </form>


  <div class="mat-elevation-z1 container-table">
    <div *ngIf="loading" class="progress-content">
      <app-loading></app-loading>
    </div>
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="descrip">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Servicio </th>
        <td mat-cell *matCellDef="let row"> {{row.descrip}} </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row" align="end" class="action">
          <button mat-icon-button (click)="deleteSpec(row.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row no-data" *matNoDataRow>
        <td class="mat-cell" colspan="100%">No hay registro</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" aria-label="Select page of dataSource"></mat-paginator>
  </div>
</section>
