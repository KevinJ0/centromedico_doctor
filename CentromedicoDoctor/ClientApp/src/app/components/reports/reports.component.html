<main *ngIf="routerUrl == '/app/reportes'; else report">

  <div class="title-container">
    <h2 class="title">Reportes</h2>
    <mat-divider></mat-divider>
  </div>


  <mat-card class="filter">
    <mat-card-title>Filtro</mat-card-title>
    <mat-divider inset></mat-divider>
    <mat-card-content>


      <form [formGroup]="filterFormGroup" class="form-group">

        <mat-form-field style="grid-area: dates;" appearance="outline">
          <mat-label>Rango de fechas</mat-label>
          <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
            <input matStartDate formControlName="startDateControl" placeholder="Fecha inicio">
            <input matEndDate formControlName="endDateControl" placeholder="Fecha fin">
          </mat-date-range-input>
          <mat-hint>DD/MM/YYYY – DD/MM/YYYY</mat-hint>
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-date-range-picker #picker></mat-date-range-picker>
        </mat-form-field>

        <mat-form-field style="grid-area: serviceType;" appearance="outline">
          <mat-label>Tipo de servicio</mat-label>
          <mat-select formControlName="serviceTypeControl" name="service" value="">
            <mat-option value="">
              Todos
            </mat-option>
            <mat-option *ngFor="let servicio of servicios" [value]="servicio.id">
              {{servicio.descrip}}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field style="grid-area: insurance;" appearance="outline">
          <mat-label>Seguro</mat-label>
          <mat-select formControlName="insuranceControl" value="">
            <mat-option value=''>
              Todos
            </mat-option>
            <mat-option *ngFor="let seguro of seguros" [value]="seguro.id">
              {{seguro.descrip}}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field style="grid-area: states;" appearance="outline">
          <mat-label>Estados</mat-label>
          <mat-select formControlName="statusControl" value=''>
            <mat-option value=''>
              Todos
            </mat-option>
            <mat-option value="false">
              Realizadas
            </mat-option>
            <mat-option value="true">
              No Realizadas
            </mat-option>
          </mat-select>
        </mat-form-field>

        <button (click)="GenerateReport()" mat-flat-button color="primary" class="generate-rep-btn">Generar</button>

      </form>
    </mat-card-content>
  </mat-card>

</main>
<ng-template #report>
  <router-outlet></router-outlet>
</ng-template>
