<main>
  <div class="calendar-container">
    <div class="title-container">
      <h2 class="title">Calendario</h2>
      <mat-divider></mat-divider>
    </div>

    <div *ngIf="!loadingC else load" class="">

      <mat-stepper id="dashboard-stepper" #stepper>

        <mat-step>
          <ng-template matStepLabel>
            <mat-icon>event</mat-icon> Calendario
          </ng-template>

          <div style="margin-top:10px">
            <div class="row text-center">
              <div class="col-md-4">
                <div class="btn-group">
                  <div class="btn btn-primary" mwlCalendarPreviousView [view]="view" [(viewDate)]="viewDate"
                    (viewDateChange)="closeOpenMonthViewDay()">
                    Atrás
                  </div>
                  <div class="btn btn-outline-secondary" mwlCalendarToday [(viewDate)]="viewDate">
                    Hoy
                  </div>
                  <div class="btn btn-primary" mwlCalendarNextView [view]="view" [(viewDate)]="viewDate"
                    (viewDateChange)="closeOpenMonthViewDay()">
                    Siguiente
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <h3>{{ viewDate | calendarDate:(view + 'ViewTitle'):'es-DO' }}</h3>
              </div>
              <div class="col-md-4">
                <div class="btn-group">
                  <div class="btn btn-primary" (click)="setView(CalendarView.Month)"
                    [class.active]="view === CalendarView.Month">
                    Mes
                  </div>
                  <div class="btn btn-primary" (click)="setView(CalendarView.Week)"
                    [class.active]="view === CalendarView.Week">
                    Semana
                  </div>
                  <div class="btn btn-primary" (click)="setView(CalendarView.Day)"
                    [class.active]="view === CalendarView.Day">
                    Día
                  </div>
                </div>
              </div>
            </div>
          </div>

          <br>

          <div [ngSwitch]="view">
            <mwl-calendar-month-view *ngSwitchCase="CalendarView.Month" [viewDate]="viewDate" [events]="events"
              [locale]="locale" [refresh]="refresh" [activeDayIsOpen]="activeDayIsOpen"
              (dayClicked)="dayClicked($event.day)" (eventClicked)="handleEvent('Clicked', $event.event)"
              (eventTimesChanged)="eventTimesChanged($event)">
            </mwl-calendar-month-view>
            <mwl-calendar-week-view *ngSwitchCase="CalendarView.Week" [locale]="locale" [viewDate]="viewDate"
              [events]="events" [refresh]="refresh" (eventClicked)="handleEvent('Clicked', $event.event)"
              (eventTimesChanged)="eventTimesChanged($event)">
            </mwl-calendar-week-view>
            <mwl-calendar-day-view *ngSwitchCase="CalendarView.Day" [locale]="locale" [viewDate]="viewDate"
              [events]="events" [refresh]="refresh" (eventClicked)="handleEvent('Clicked', $event.event)"
              (eventTimesChanged)="eventTimesChanged($event)">
            </mwl-calendar-day-view>
          </div>
        </mat-step>



        <mat-step>
          <ng-template matStepLabel>
            <mat-icon>toc</mat-icon> Tabla
          </ng-template>

          <div style="margin-top:10px">
            <app-table-appointments [citas]="_citasArr"></app-table-appointments>
          </div>
        </mat-step>
      </mat-stepper>
    </div>
    


    <ng-template #load>
      <div class="progress-content">
        <mat-progress-spinner diameter=40 strokeWidth=2 [mode]="mode">
        </mat-progress-spinner>
      </div>
    </ng-template>
  </div>
</main>
